# MSR-RCAN-large-50-cosine + Teacher Distillation (alpha=0.1)
# Student: MSR-RCAN-large 8g8b + MSRCAB + Deep Refine v2
# Teacher: RCAN-pretrained (frozen, Y+crop 32.52 dB)
# Target: push beyond 31.28 dB, aim for 32 dB
model: msr_rcan_large
scale: 4

model_params:
  in_channels: 3
  out_channels: 3
  num_features: 64
  num_resgroups: 8
  num_resblocks: 8
  reduction: 16

data:
  train_hr: data_final/ucmerced_selected/train/HR
  train_lr: data_final/ucmerced_selected/train/LR_x4
  val_hr: data_final/ucmerced_selected/val/HR
  val_lr: data_final/ucmerced_selected/val/LR_x4
  test_hr: data_final/ucmerced_selected/test/HR
  test_lr: data_final/ucmerced_selected/test/LR_x4

train:
  epochs: 50
  batch_size: 8
  patch_size: 128
  lr: 2.0e-4
  num_workers: 4
  save_dir: checkpoints/msr_rcan_large50_cosine_distill_a01_x4
  loss: l1
  optimizer: adam
  scheduler: cosine
  min_lr: 1.0e-6
  augment: false

# Teacher distillation config
distillation:
  enabled: true
  teacher_model: rcan_pretrained
  teacher_checkpoint: checkpoints/rcan_x4/pretrained_rcan_x4.pth
  alpha: 0.1

eval:
  save_dir: results/msr_rcan_large50_cosine_distill_a01_x4
  compare_dir: results/msr_rcan_large50_cosine_distill_a01_x4/comparisons
  crop_border: 4
  test_y_channel: true
