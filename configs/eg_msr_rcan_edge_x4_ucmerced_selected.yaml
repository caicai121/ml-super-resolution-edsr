# EG-MSR-RCAN + Edge Loss x4 training
# Edge-Guided Multi-Scale Refined RCAN with Sobel Edge Loss
model: eg_msr_rcan
scale: 4

model_params:
  in_channels: 3
  out_channels: 3
  num_features: 64
  num_resgroups: 5
  num_resblocks: 5
  reduction: 16
  edge_mid_channels: 32
  edge_num_layers: 3

data:
  train_hr: data_final/ucmerced_selected/train/HR
  train_lr: data_final/ucmerced_selected/train/LR_x4
  val_hr: data_final/ucmerced_selected/val/HR
  val_lr: data_final/ucmerced_selected/val/LR_x4
  test_hr: data_final/ucmerced_selected/test/HR
  test_lr: data_final/ucmerced_selected/test/LR_x4

train:
  epochs: 50
  batch_size: 8
  patch_size: 128
  lr: 2.0e-4
  num_workers: 4
  save_dir: checkpoints/eg_msr_rcan_edge_x4
  loss: l1
  optimizer: adam
  scheduler: cosine
  min_lr: 1.0e-6
  augment: false
  edge_lambda: 0.01

eval:
  save_dir: results/eg_msr_rcan_edge_x4
  compare_dir: results/eg_msr_rcan_edge_x4/comparisons
  crop_border: 4
  test_y_channel: true
