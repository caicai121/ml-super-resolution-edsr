# Cascade-MSR-RCAN-large Stage2-10 extended training (200 epochs)
# This is an EXTENDED TRAINING experiment - does NOT replace 50-epoch main results.
# Purpose: observe performance upper bound with longer training budget.
model: cascade_msr_rcan_large
scale: 4

model_params:
  in_channels: 3
  out_channels: 3
  num_features: 64
  num_resgroups: 8
  num_resblocks: 8
  reduction: 16
  # Stage 2 cascade params (10 blocks)
  cascade_num_blocks: 10
  cascade_mid_channels: 64
  cascade_residual_scale: 0.1

data:
  train_hr: data_final/ucmerced_selected/train/HR
  train_lr: data_final/ucmerced_selected/train/LR_x4
  val_hr: data_final/ucmerced_selected/val/HR
  val_lr: data_final/ucmerced_selected/val/LR_x4
  test_hr: data_final/ucmerced_selected/test/HR
  test_lr: data_final/ucmerced_selected/test/LR_x4

train:
  epochs: 200
  batch_size: 8
  patch_size: 128
  lr: 2.0e-4
  num_workers: 4
  save_dir: checkpoints/cascade_msr_rcan_large_s10_200_cosine_x4
  loss: l1
  optimizer: adam
  scheduler: cosine
  min_lr: 1.0e-6
  augment: false

eval:
  save_dir: results/cascade_msr_rcan_large_s10_200_cosine_x4
  compare_dir: results/cascade_msr_rcan_large_s10_200_cosine_x4/comparisons
  crop_border: 4
  test_y_channel: true
