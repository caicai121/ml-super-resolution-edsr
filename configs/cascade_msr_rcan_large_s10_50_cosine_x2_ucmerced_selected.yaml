# Cascade-MSR-RCAN-large Stage2-10 x2 supplementary experiment
# Only change from x4: scale=2, LR_x2 data, crop_border=2
model: cascade_msr_rcan_large
scale: 2

model_params:
  in_channels: 3
  out_channels: 3
  num_features: 64
  num_resgroups: 8
  num_resblocks: 8
  reduction: 16
  scale: 2
  # Stage 2 cascade params (10 blocks)
  cascade_num_blocks: 10
  cascade_mid_channels: 64
  cascade_residual_scale: 0.1

data:
  train_hr: data_final/ucmerced_selected/train/HR
  train_lr: data_final/ucmerced_selected/train/LR_x2
  val_hr: data_final/ucmerced_selected/val/HR
  val_lr: data_final/ucmerced_selected/val/LR_x2
  test_hr: data_final/ucmerced_selected/test/HR
  test_lr: data_final/ucmerced_selected/test/LR_x2

train:
  epochs: 50
  batch_size: 8
  patch_size: 128
  lr: 2.0e-4
  num_workers: 4
  save_dir: checkpoints/cascade_msr_rcan_large_s10_50_cosine_x2
  loss: l1
  optimizer: adam
  scheduler: cosine
  min_lr: 1.0e-6
  augment: false

eval:
  save_dir: results/cascade_msr_rcan_large_s10_50_cosine_x2
  compare_dir: results/cascade_msr_rcan_large_s10_50_cosine_x2/comparisons
  crop_border: 2
  test_y_channel: true
