# MSR-RCAN-mid-50-cosine x2 training
# 5g5b + MSRCAB + Deep Refine + Cosine LR
model: msr_rcan_mid
scale: 2

model_params:
  in_channels: 3
  out_channels: 3
  num_features: 64
  num_resgroups: 5
  num_resblocks: 5
  reduction: 16

data:
  train_hr: data_final/ucmerced_selected/train/HR
  train_lr: data_final/ucmerced_selected/train/LR_x2
  val_hr: data_final/ucmerced_selected/val/HR
  val_lr: data_final/ucmerced_selected/val/LR_x2
  test_hr: data_final/ucmerced_selected/test/HR
  test_lr: data_final/ucmerced_selected/test/LR_x2

train:
  epochs: 50
  batch_size: 8
  patch_size: 128
  lr: 2.0e-4
  num_workers: 4
  save_dir: checkpoints/msr_rcan_mid50_cosine_x2
  loss: l1
  optimizer: adam
  scheduler: cosine
  min_lr: 1.0e-6
  augment: false

eval:
  save_dir: results/msr_rcan_mid50_cosine_x2
  compare_dir: results/msr_rcan_mid50_cosine_x2/comparisons
  crop_border: 2
  test_y_channel: true
