model: light_edsr
scale: 2

data:
  root: data
  train_hr: data/train/HR
  train_lr: data/train/LR_x2
  val_hr: data/val/HR
  val_lr: data/val/LR_x2
  test_hr: data/test/HR
  test_lr: data/test/LR_x2

model_params:
  in_channels: 3
  out_channels: 3
  num_features: 64
  num_res_blocks: 8
  res_scale: 0.1

train:
  epochs: 30
  batch_size: 32
  patch_size: 96
  lr: 0.0001
  num_workers: 10
  loss: l1
  save_dir: checkpoints/light_edsr

eval:
  save_dir: results/light_edsr
  compare_dir: results/comparisons_light_edsr
